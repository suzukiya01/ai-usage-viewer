<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI使用状況 クラウドビューア（スマホ・PC共通）</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top left, #eef2ff 0%, #f8fafc 45%, #f1f5f9 100%);
      color: #0f172a;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div class="max-w-5xl mx-auto px-4 py-5 space-y-5">
    <header class="bg-white/95 rounded-3xl border border-slate-200/80 p-4 sm:p-5 shadow-sm flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <h1 class="text-lg sm:text-xl font-extrabold text-slate-900">AI使用状況 クラウドビューア</h1>
        <p id="sync-meta" class="text-xs text-slate-500 mt-0.5">PC版Chrome拡張機能とGitHub Gistで同期</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200/70">
          <button id="btn-mode-used" type="button" class="px-3 py-1 text-xs font-semibold rounded-lg">使用済み (%)</button>
          <button id="btn-mode-remaining" type="button" class="px-3 py-1 text-xs font-semibold rounded-lg">残り容量 (%)</button>
        </div>
        <button id="btn-refresh-gist" type="button" class="px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-indigo-600 text-white hover:bg-indigo-700">
          最新データ取得
        </button>
        <button id="btn-toggle-gist-setup" type="button" class="px-3 py-1.5 text-xs font-medium rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">
          Gist設定
        </button>
      </div>
    </header>

    <!-- Gist ID Setup Bar -->
    <section id="gist-setup-box" class="hidden bg-white rounded-2xl border border-indigo-200 p-4 shadow-sm space-y-2.5">
      <div class="text-xs font-bold text-slate-800">連携する Gist ID を設定</div>
      <p class="text-xs text-slate-500">PC側拡張機能の「クラウド同期設定」で発行された Gist ID を入力してください（URLに <code>?gist=ID</code> を付けてブックマークすることもできます）。</p>
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="input-gist-id" type="text" placeholder="32桁のGist ID" class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-xs font-mono" />
        <button id="btn-save-gist-id" type="button" class="px-4 py-2 text-xs font-semibold rounded-xl bg-indigo-600 text-white hover:bg-indigo-700">保存して読み込む</button>
      </div>
    </section>

    <section id="recommendation-banner" class="rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-700 text-white p-4 shadow-md text-sm leading-relaxed"></section>

    <section id="cards-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></section>

    <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm">
        <h2 id="weekly-title" class="text-sm font-bold text-slate-900 mb-3">週間利用上限の比較</h2>
        <div id="weekly-bars" class="space-y-2.5"></div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm">
        <h2 id="session-title" class="text-sm font-bold text-slate-900 mb-3">短期（セッション / 5時間）枠の比較</h2>
        <div id="session-bars" class="space-y-2.5"></div>
      </div>
    </section>

    <section class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm overflow-x-auto">
      <h2 class="text-sm font-bold text-slate-900 mb-3">リセット予定 &amp; 週間消費ペース</h2>
      <table class="w-full text-left border-collapse text-xs">
        <thead>
          <tr class="border-b border-slate-200 text-slate-500">
            <th class="py-2 pr-3">サービス / 枠</th>
            <th class="py-2 px-3">状態</th>
            <th class="py-2 px-3">リセット予定</th>
            <th class="py-2 pl-3">ペース / 備考</th>
          </tr>
        </thead>
        <tbody id="timeline-body" class="divide-y divide-slate-100"></tbody>
      </table>
    </section>
  </div>

  <script>
    const GIST_KEY = 'ai_usage_mobile_gist_id_v1';
    const MODE_KEY = 'ai_usage_mobile_mode_v1';

    const FALLBACK_STATE = {
      mode: 'used',
      syncedAt: null,
      services: {
        claude: { id: 'claude', name: 'Claude', plan: 'Pro', color: '#D97757', sessionUsed: 9, sessionResetText: '21:00にリセットされます', weeklyUsed: 34, weeklyResetText: '4:00 (日曜日)にリセット', weeklyResetAt: '2026-11-22T04:00:00+09:00', extraLabel: 'Fable のみ (週間)', extraUsed: 58, memo: '長文構成・丁寧な文章作成・壁打ち', lastFetched: '2026/11/16 17:44' },
        chatgpt: { id: 'chatgpt', name: 'ChatGPT', plan: 'Plus', color: '#10A37F', sessionUsed: 78, sessionResetText: 'リセットまで 3時間51分', weeklyUsed: 85, weeklyResetText: 'リセットまで 2時間59分', weeklyResetAt: '2026-11-16T20:37:00+09:00', extraLabel: null, extraUsed: null, memo: 'エージェント処理・定型タスク自動化', lastFetched: '2026/11/16 17:44' },
        gemini: { id: 'gemini', name: 'Gemini', plan: 'PRO', color: '#3B82F6', sessionUsed: 54, sessionResetText: '18:41にリセット', weeklyUsed: 4, weeklyResetText: '11月20日の20:41にリセットされます', weeklyResetAt: '2026-11-20T20:41:00+09:00', extraLabel: null, extraUsed: null, memo: '重い調査・コード生成・画像/長文読解', lastFetched: '2026/11/16 17:44' }
      }
    };

    let state = JSON.parse(JSON.stringify(FALLBACK_STATE));
    let viewMode = 'used';

    try {
      const savedMode = localStorage.getItem(MODE_KEY);
      if (savedMode === 'used' || savedMode === 'remaining') viewMode = savedMode;
    } catch (e) {}

    function getSavedGistId() {
      const params = new URLSearchParams(location.search);
      const fromUrl = params.get('gist');
      if (fromUrl) {
        try { localStorage.setItem(GIST_KEY, fromUrl.trim()); } catch (e) {}
        return fromUrl.trim();
      }
      try { return localStorage.getItem(GIST_KEY) || ''; } catch (e) { return ''; }
    }

    function getVal(usedPct) {
      if (usedPct === null || usedPct === undefined) return 0;
      return viewMode === 'used' ? usedPct : (100 - usedPct);
    }

    function calcPace(usedPct, resetAtIso) {
      if (!resetAtIso || usedPct === 0) return '消費なし';
      const msLeft = new Date(resetAtIso).getTime() - Date.now();
      if (msLeft <= 0) return 'リセット待ち';
      const elapsedDays = Math.max(0.35, (7 * 24 * 3600 * 1000 - msLeft) / (24 * 3600 * 1000));
      const projected = Math.round((usedPct / elapsedDays) * 7);
      return `週換算 ${projected}%`;
    }

    function ringSvg(val, color, label) {
      const r = 28, c = 2 * Math.PI * r, off = c * (1 - val / 100);
      return `<svg width="74" height="74" viewBox="0 0 74 74" class="mx-auto"><circle cx="37" cy="37" r="${r}" stroke="#e2e8f0" stroke-width="7" fill="none"/><circle cx="37" cy="37" r="${r}" stroke="${color}" stroke-width="7" stroke-linecap="round" fill="none" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 37 37)"/><text x="37" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">${val}%</text><text x="37" y="49" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">${label}</text></svg>`;
    }

    function render() {
      const isUsed = viewMode === 'used';
      const modeLabel = isUsed ? '使用済み' : '残り';
      document.getElementById('btn-mode-used').className = isUsed ? 'px-3 py-1 text-xs font-semibold rounded-lg bg-white text-slate-900 shadow-sm' : 'px-3 py-1 text-xs font-semibold rounded-lg text-slate-500';
      document.getElementById('btn-mode-remaining').className = !isUsed ? 'px-3 py-1 text-xs font-semibold rounded-lg bg-white text-slate-900 shadow-sm' : 'px-3 py-1 text-xs font-semibold rounded-lg text-slate-500';

      const s = state.services;
      const ready = [
        { name: 'Claude', sRem: 100 - s.claude.sessionUsed, wRem: 100 - s.claude.weeklyUsed },
        { name: 'ChatGPT', sRem: 100 - s.chatgpt.sessionUsed, wRem: 100 - s.chatgpt.weeklyUsed },
        { name: 'Gemini Pro', sRem: 100 - s.gemini.sessionUsed, wRem: 100 - s.gemini.weeklyUsed }
      ].filter((c) => c.sRem > 0 && c.wRem > 0).sort((a, b) => (b.sRem + b.wRem) - (a.sRem + a.wRem));

      document.getElementById('recommendation-banner').innerHTML = ready.length > 0
        ? `<strong>いまの最適選択：</strong> 最も余裕があるのは <strong>${ready[0].name}</strong>（短期残り ${ready[0].sRem}% / 週間残り ${ready[0].wRem}%）です。`
        : `<strong>注意：</strong> 全サービスの短期または週間枠が上限に達しています。`;

      document.getElementById('cards-grid').innerHTML = ['claude', 'chatgpt', 'gemini'].map((id) => {
        const svc = s[id];
        return `
          <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full" style="background:${svc.color}"></span><span class="font-extrabold text-slate-900">${svc.name}</span></div>
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">${svc.plan}</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div class="bg-slate-50 rounded-xl p-2 text-center">${ringSvg(getVal(svc.sessionUsed), svc.color, modeLabel)}<div class="text-[11px] font-bold mt-1">${id === 'chatgpt' ? '5時間枠' : 'セッション'}</div><div class="text-[10px] text-slate-500">${svc.sessionResetText || ''}</div></div>
              <div class="bg-slate-50 rounded-xl p-2 text-center">${ringSvg(getVal(svc.weeklyUsed), svc.color, modeLabel)}<div class="text-[11px] font-bold mt-1">週間上限</div><div class="text-[10px] text-slate-500">${svc.weeklyResetText || ''}</div></div>
            </div>
            ${svc.memo ? `<div class="text-[11px] bg-slate-50 rounded-lg px-2.5 py-1.5 text-slate-600 border border-slate-100">担当: ${svc.memo}</div>` : ''}
            <div class="text-[11px] text-slate-400 text-right">${svc.lastFetched || ''}</div>
          </div>
        `;
      }).join('');

      document.getElementById('weekly-title').textContent = `週間利用上限の比較（${modeLabel}%）`;
      document.getElementById('session-title').textContent = `短期枠の比較（${modeLabel}%）`;

      const barHtml = (items) => items.map((i) => `
        <div><div class="flex justify-between text-xs font-semibold mb-1"><span>${i.label}</span><span class="tabular-nums">${i.val}%</span></div><div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${i.val}%;background:${i.color}"></div></div></div>
      `).join('');

      document.getElementById('weekly-bars').innerHTML = barHtml([
        { label: 'Claude (全モデル)', val: getVal(s.claude.weeklyUsed), color: '#D97757' },
        { label: 'Claude (Fableのみ)', val: getVal(s.claude.extraUsed), color: '#F59E0B' },
        { label: 'ChatGPT (週間)', val: getVal(s.chatgpt.weeklyUsed), color: '#10A37F' },
        { label: 'Gemini Pro (週間)', val: getVal(s.gemini.weeklyUsed), color: '#3B82F6' }
      ]);

      document.getElementById('session-bars').innerHTML = barHtml([
        { label: 'Claude (セッション)', val: getVal(s.claude.sessionUsed), color: '#D97757' },
        { label: 'ChatGPT (5時間枠)', val: getVal(s.chatgpt.sessionUsed), color: '#10A37F' },
        { label: 'Gemini Pro (現在)', val: getVal(s.gemini.sessionUsed), color: '#3B82F6' }
      ]);

      document.getElementById('timeline-body').innerHTML = [
        { n: 'Claude (週間)', v: getVal(s.claude.weeklyUsed), r: s.claude.weeklyResetText, p: calcPace(s.claude.weeklyUsed, s.claude.weeklyResetAt) },
        { n: 'ChatGPT (週間)', v: getVal(s.chatgpt.weeklyUsed), r: s.chatgpt.weeklyResetText, p: calcPace(s.chatgpt.weeklyUsed, s.chatgpt.weeklyResetAt) },
        { n: 'Gemini Pro (週間)', v: getVal(s.gemini.weeklyUsed), r: s.gemini.weeklyResetText, p: calcPace(s.gemini.weeklyUsed, s.gemini.weeklyResetAt) }
      ].map((r) => `<tr><td class="py-2 pr-3 font-semibold">${r.n}</td><td class="py-2 px-3">${modeLabel} ${r.v}%</td><td class="py-2 px-3">${r.r || '-'}</td><td class="py-2 pl-3">${r.p}</td></tr>`).join('');
    }

    async function fetchFromGist(gistId) {
      const meta = document.getElementById('sync-meta');
      if (!gistId) {
        meta.textContent = 'Gist未設定（右上の「Gist設定」から連携するとPCの最新データを受信できます）';
        render();
        return;
      }
      meta.textContent = 'GitHub Gistから最新データを読み込み中...';
      try {
        const resp = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        const file = data.files && data.files['ai-usage-data.json'];
        if (!file || !file.content) throw new Error('no_data_file');
        state = JSON.parse(file.content);
        const t = state.syncedAt ? new Date(state.syncedAt).toLocaleString('ja-JP') : '取得完了';
        meta.textContent = `クラウド同期済み（PC最終更新: ${t}）`;
        render();
      } catch (e) {
        meta.textContent = 'Gistの読み込みに失敗しました。Gist IDを確認してください。';
        render();
      }
    }

    document.getElementById('btn-mode-used').addEventListener('click', () => {
      viewMode = 'used';
      try { localStorage.setItem(MODE_KEY, viewMode); } catch (e) {}
      render();
    });

    document.getElementById('btn-mode-remaining').addEventListener('click', () => {
      viewMode = 'remaining';
      try { localStorage.setItem(MODE_KEY, viewMode); } catch (e) {}
      render();
    });

    document.getElementById('btn-toggle-gist-setup').addEventListener('click', () => {
      const box = document.getElementById('gist-setup-box');
      box.classList.toggle('hidden');
      document.getElementById('input-gist-id').value = getSavedGistId();
    });

    document.getElementById('btn-save-gist-id').addEventListener('click', () => {
      const id = document.getElementById('input-gist-id').value.trim();
      try { localStorage.setItem(GIST_KEY, id); } catch (e) {}
      document.getElementById('gist-setup-box').classList.add('hidden');
      fetchFromGist(id);
    });

    document.getElementById('btn-refresh-gist').addEventListener('click', () => {
      fetchFromGist(getSavedGistId());
    });

    window.addEventListener('DOMContentLoaded', () => {
      fetchFromGist(getSavedGistId());
    });
  </script>
</body>
</html>
